<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智研助手 · 文献与笔记问答</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: #cbd5e1; }
  textarea { width: 100%; min-height: 120px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 8px; color: #e2e8f0; resize: vertical; font-size: 13px; }
  input[type="text"] { width: 100%; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 8px; color: #e2e8f0; font-size: 14px; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  button { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .primary { background: #3b82f6; color: white; }
  .primary:hover { background: #2563eb; }
  .ghost { background: #334155; color: #cbd5e1; }
  .answer { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 12px; margin-top: 10px; min-height: 60px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
  .sources { margin-top: 8px; font-size: 12px; color: #94a3b8; }
  .source { padding: 4px 0; border-top: 1px solid #1e293b; }
  .source.expandable { cursor: pointer; }
  .source .full { display: none; margin-top: 4px; color: #cbd5e1; white-space: pre-wrap; }
  .source.open .full { display: block; }
  .source.open .brief { display: none; }
  .source.open .full::after { content: "（点击收起）"; display: block; color: #64748b; font-size: 11px; margin-top: 4px; }
  .tag { display: inline-block; background: #1e40af; color: #93c5fd; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 4px; }
  .history { max-height: 200px; overflow-y: auto; font-size: 12px; }
  .hist-item { padding: 6px 0; border-bottom: 1px solid #334155; }
  .hist-time { color: #64748b; font-size: 11px; margin-left: 6px; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <h1>智研助手</h1>
  <div class="sub">基于 seekdb 语义检索 + PowerContext 记忆 + MiniMax 大模型的文献问答助手</div>

  <div class="grid">
    <div class="card">
      <h2>1. 导入文献/笔记 <span id="doc-count" style="font-size:12px;color:#94a3b8;font-weight:normal;"></span></h2>
      <input type="text" id="title" placeholder="标题（可选）" style="margin-bottom:8px;" />
      <textarea id="doc-text" placeholder="粘贴论文摘要、笔记内容..."></textarea>
      <div class="row">
        <button class="primary" onclick="importDoc()">导入并索引</button>
        <button class="ghost" onclick="clearDocs()">清空知识库</button>
        <span id="import-status" style="font-size:12px;color:#94a3b8;align-self:center;"></span>
      </div>
    </div>

    <div class="card">
      <h2>2. 智能问答</h2>
      <input type="text" id="question" placeholder="输入问题，如：机器学习的主要应用有哪些？" />
      <div class="row">
        <button class="primary" onclick="ask()">提问</button>
        <span id="ask-status" style="font-size:12px;color:#94a3b8;align-self:center;"></span>
      </div>
      <div class="answer" id="answer">等待提问...</div>
      <div class="sources" id="sources"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h2>3. 历史交互（PowerContext 记忆）</h2>
    <div class="history" id="history">暂无记录</div>
    <div class="row" style="margin-top:8px;">
      <button class="ghost" onclick="loadHistory()">刷新历史</button>
    </div>
  </div>
</div>

<script>
async function importDoc() {
  const text = document.getElementById('doc-text').value.trim();
  const title = document.getElementById('title').value.trim();
  if (!text) return alert('请输入文本内容');
  document.getElementById('import-status').textContent = '索引中...';
  const r = await fetch('/api/import', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text, title})
  });
  const d = await r.json();
  document.getElementById('import-status').textContent = d.ok ? `已索引 ${d.count} 个段落` : d.error;
  document.getElementById('doc-text').value = '';
  loadStats();
}

async function clearDocs() {
  if (!confirm('确定清空知识库？zhiyan_docs 中的全部段落都会被删除，且不可恢复。')) return;
  document.getElementById('import-status').textContent = '清空中...';
  const r = await fetch('/api/clear', {method: 'DELETE'});
  const d = await r.json();
  document.getElementById('import-status').textContent = d.ok ? '知识库已清空' : (d.error || '清空失败');
  loadStats();
}

async function loadStats() {
  const el = document.getElementById('doc-count');
  try {
    const r = await fetch('/api/stats');
    const d = await r.json();
    el.textContent = `库内 ${d.docs ?? 0} 段`;
  } catch (e) {
    el.textContent = '统计不可用';
  }
}

async function ask() {
  const q = document.getElementById('question').value.trim();
  if (!q) return;
  document.getElementById('ask-status').textContent = '检索中...';
  document.getElementById('answer').textContent = '思考中...';
  const r = await fetch('/api/query', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question: q, user_id: 'default'})
  });
  const d = await r.json();
  document.getElementById('ask-status').textContent = '';
  document.getElementById('answer').textContent = d.answer;
  renderSources(d.sources || []);
  loadHistory();
}

function renderSources(sources) {
  const box = document.getElementById('sources');
  box.textContent = '';
  sources.forEach((s, i) => {
    const full = s.content || '';
    const div = document.createElement('div');
    div.className = 'source';
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = `来源${i+1}`;
    div.appendChild(tag);
    if (s.title) {
      const title = document.createElement('span');
      title.textContent = s.title + ' ';
      div.appendChild(title);
    }
    if (full.length > 80) {
      div.classList.add('expandable');
      const brief = document.createElement('span');
      brief.className = 'brief';
      brief.textContent = `${full.slice(0, 80)}…（点击展开）`;
      div.appendChild(brief);
      const detail = document.createElement('div');
      detail.className = 'full';
      detail.textContent = full;
      div.appendChild(detail);
      div.onclick = () => div.classList.toggle('open');
    } else {
      const brief = document.createElement('span');
      brief.textContent = full;
      div.appendChild(brief);
    }
    box.appendChild(div);
  });
}

function fmtTime(value) {
  const date = new Date(value);
  return isNaN(date) ? String(value) : date.toLocaleString('zh-CN', {hour12: false});
}

async function loadHistory() {
  const r = await fetch('/api/history/default');
  const d = await r.json();
  const el = document.getElementById('history');
  el.textContent = '';
  const list = (d.history || []).slice(-5).reverse();
  if (!list.length) {
    el.textContent = '暂无记录';
    return;
  }
  list.forEach(h => {
    const item = document.createElement('div');
    item.className = 'hist-item';
    const qLabel = document.createElement('b');
    qLabel.textContent = 'Q:';
    item.appendChild(qLabel);
    item.appendChild(document.createTextNode(' ' + (h.question || '')));
    const when = h.created_at || h.updated_at;
    if (when) {
      const time = document.createElement('span');
      time.className = 'hist-time';
      time.textContent = fmtTime(when);
      item.appendChild(time);
    }
    item.appendChild(document.createElement('br'));
    const aLabel = document.createElement('b');
    aLabel.textContent = 'A:';
    item.appendChild(aLabel);
    item.appendChild(document.createTextNode(' ' + (h.answer || '').slice(0, 100)));
    el.appendChild(item);
  });
}
loadHistory();
loadStats();
</script>
</body>
</html>
